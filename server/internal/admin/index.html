<!doctype html>
<!-- ABOUTME: tt7-server's admin page: each screen's status, its URL (editable), reload, and the last pushed frame. -->
<!-- ABOUTME: Everything from the API goes in with textContent; the token (if any) stays in sessionStorage. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tt7-server</title>
<style>
  :root { --bg: #fafafa; --fg: #1a1a1a; --muted: #666; --card: #fff; --line: #ddd; --bad: #b00020; --ok: #1b7f3b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --fg: #eee; --muted: #999; --card: #1e1e1e; --line: #333; --bad: #ff6b81; --ok: #5fd38d; }
  }
  body { margin: 0; padding: 16px; font: 15px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
  input[type=url], input[type=password] { flex: 1; min-width: 200px; padding: 6px; }
  img { max-width: 100%; border: 1px solid var(--line); display: block; margin-top: 8px; }
  .muted { color: var(--muted); }
  .bad { color: var(--bad); }
  .ok { color: var(--ok); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>tt7-server</h1>
<div class="row" id="tokenRow" hidden>
  <input type="password" id="token" placeholder="admin token">
  <button id="saveToken">Use token</button>
</div>
<p id="msg" class="bad"></p>
<div id="screens"></div>
<template id="card">
  <div class="card">
    <div class="row"><strong class="name"></strong><span class="host muted"></span><span class="state"></span></div>
    <div class="row muted info"></div>
    <div class="row bad err"></div>
    <div class="row"><input type="url" class="url"><button class="save">Set URL</button><button class="reload">Reload</button></div>
    <img class="preview" alt="last frame pushed to this panel">
  </div>
</template>
<script>
"use strict";
let token = "";
try { token = sessionStorage.getItem("tt7-admin-token") || ""; } catch (e) {}
const cards = {};

function api(method, path, body) {
  const headers = {};
  if (token) headers["Authorization"] = "Bearer " + token;
  if (body !== undefined) headers["Content-Type"] = "application/json";
  return fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
}

function say(text) { document.getElementById("msg").textContent = text; }

function card(s) {
  if (cards[s.name]) return cards[s.name];
  const node = document.getElementById("card").content.firstElementChild.cloneNode(true);
  const c = { node, previewAt: null, url: node.querySelector(".url") };
  node.querySelector(".save").addEventListener("click", async () => {
    const r = await api("PUT", "/api/screens/" + encodeURIComponent(s.name) + "/url", { url: c.url.value });
    say(r.ok ? "" : (await r.json()).message);
    c.editing = false;
    refresh();
  });
  node.querySelector(".reload").addEventListener("click", async () => {
    const r = await api("POST", "/api/screens/" + encodeURIComponent(s.name) + "/reload");
    say(r.ok ? "" : (await r.json()).message);
  });
  c.url.addEventListener("input", () => { c.editing = true; });
  document.getElementById("screens").appendChild(node);
  cards[s.name] = c;
  return c;
}

async function preview(s, c) {
  if (!s.last_push_at || c.previewAt === s.last_push_at) return;
  c.previewAt = s.last_push_at;
  const r = await api("GET", "/api/screens/" + encodeURIComponent(s.name) + "/preview.png");
  if (!r.ok) return;
  const img = c.node.querySelector(".preview");
  if (img.src) URL.revokeObjectURL(img.src);
  img.src = URL.createObjectURL(await r.blob());
}

async function refresh() {
  let r;
  try { r = await api("GET", "/api/screens"); } catch (e) { say("server unreachable"); return; }
  document.getElementById("tokenRow").hidden = r.status !== 401;
  if (!r.ok) { say(r.status === 401 ? "this server needs its admin token" : "HTTP " + r.status); return; }
  for (const s of (await r.json()).screens) {
    const c = card(s);
    c.node.querySelector(".name").textContent = s.name;
    c.node.querySelector(".host").textContent = s.host;
    const state = c.node.querySelector(".state");
    state.textContent = !s.enabled ? "disabled" : s.reachable ? "reachable" : "unreachable";
    state.className = "state " + (s.enabled && s.reachable ? "ok" : "bad");
    c.node.querySelector(".info").textContent = "device " + (s.device_id || "?") + " · events " +
      (s.events_connected ? "on" : "off") + " · frames pushed " + s.frames_pushed +
      " · last push " + (s.last_push_at || "never");
    c.node.querySelector(".err").textContent = s.last_error ? s.last_error + " (" + s.last_error_at + ")" : "";
    if (!c.editing) c.url.value = s.url;
    preview(s, c);
  }
}

document.getElementById("saveToken").addEventListener("click", () => {
  token = document.getElementById("token").value;
  try { sessionStorage.setItem("tt7-admin-token", token); } catch (e) {}
  say("");
  refresh();
});
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
